name: Deploy to Prod

on:
  workflow_dispatch:
    inputs:
      description:
        description: 'Optional notes/reason for this manual deployment'
        required: false
        type: string

jobs:
  sast:
    name: Security Scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run SAST Scan
        run: npm audit --audit-level=critical

  test:
    name: Run Unit Tests
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test
        env:
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}

  verify:
    name: Verify Secrets
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Verify Environment Secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.VERCEL_TOKEN }}" ] && MISSING="$MISSING VERCEL_TOKEN"
          [ -z "${{ secrets.VERCEL_ORG_ID }}" ] && MISSING="$MISSING VERCEL_ORG_ID"
          [ -z "${{ secrets.PROD_VERCEL_PROJECT_ID }}" ] && MISSING="$MISSING PROD_VERCEL_PROJECT_ID"
          [ -z "${{ secrets.PROD_OPENAI_API_KEY }}" ] && MISSING="$MISSING PROD_OPENAI_API_KEY"
          [ -z "${{ secrets.PROD_SENTRY_DSN }}" ] && MISSING="$MISSING PROD_SENTRY_DSN"
          [ -z "${{ secrets.PROD_SUPABASE_URL }}" ] && MISSING="$MISSING PROD_SUPABASE_URL"
          [ -z "${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}" ] && MISSING="$MISSING PROD_SUPABASE_PUBLISHABLE_KEY"
          [ -z "${{ secrets.PROD_STRIPE_SECRET_KEY }}" ] && MISSING="$MISSING PROD_STRIPE_SECRET_KEY"
          [ -z "${{ secrets.PROD_STRIPE_PRICE_ID }}" ] && MISSING="$MISSING PROD_STRIPE_PRICE_ID"
          [ -z "${{ secrets.PROD_LANGFUSE_PUBLIC_KEY }}" ] && MISSING="$MISSING PROD_LANGFUSE_PUBLIC_KEY"
          [ -z "${{ secrets.PROD_LANGFUSE_SECRET_KEY }}" ] && MISSING="$MISSING PROD_LANGFUSE_SECRET_KEY"
          [ -z "${{ secrets.PROD_LANGFUSE_BASE_URL }}" ] && MISSING="$MISSING PROD_LANGFUSE_BASE_URL"
          [ -z "${{ secrets.PROD_APP_BASE_URL }}" ] && MISSING="$MISSING PROD_APP_BASE_URL"
          [ -z "${{ secrets.PROD_DB_HOST }}" ] && MISSING="$MISSING PROD_DB_HOST"
          [ -z "${{ secrets.PROD_DB_PASSWORD }}" ] && MISSING="$MISSING PROD_DB_PASSWORD"
          
          if [ -n "$MISSING" ]; then
            echo "::error::Missing GitHub Secrets:$MISSING"
            exit 1
          fi

  deploy:
    name: Deploy to Vercel (Prod)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Database Migrations (Flyway)
        run: |
          chmod +x db/migrate.sh
          ./db/migrate.sh migrate
        env:
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          DB_HOST: ${{ secrets.PROD_DB_HOST }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROD_VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: |
          echo "APP_BASE_URL=${{ secrets.PROD_APP_BASE_URL }}" >> .env
          echo "DB_HOST=${{ secrets.PROD_DB_HOST }}" >> .env
          echo "OPENAI_API_KEY=${{ secrets.PROD_OPENAI_API_KEY }}" >> .env
          echo "SENTRY_DSN=${{ secrets.PROD_SENTRY_DSN }}" >> .env
          echo "SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}" >> .env
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}" >> .env
          echo "STRIPE_SECRET_KEY=${{ secrets.PROD_STRIPE_SECRET_KEY }}" >> .env
          echo "STRIPE_PRICE_ID=${{ secrets.PROD_STRIPE_PRICE_ID }}" >> .env
          echo "LANGFUSE_PUBLIC_KEY=${{ secrets.PROD_LANGFUSE_PUBLIC_KEY }}" >> .env
          echo "LANGFUSE_SECRET_KEY=${{ secrets.PROD_LANGFUSE_SECRET_KEY }}" >> .env
          echo "LANGFUSE_BASE_URL=${{ secrets.PROD_LANGFUSE_BASE_URL }}" >> .env
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROD_VERCEL_PROJECT_ID }}
          OPENAI_API_KEY: ${{ secrets.PROD_OPENAI_API_KEY }}
          SENTRY_DSN: ${{ secrets.PROD_SENTRY_DSN }}
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.PROD_STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID: ${{ secrets.PROD_STRIPE_PRICE_ID }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.PROD_LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.PROD_LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.PROD_LANGFUSE_BASE_URL }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} \
            --env APP_BASE_URL="${{ secrets.PROD_APP_BASE_URL }}" \
            --env DB_HOST="${{ secrets.PROD_DB_HOST }}" \
            --env OPENAI_API_KEY="${{ secrets.PROD_OPENAI_API_KEY }}" \
            --env SENTRY_DSN="${{ secrets.PROD_SENTRY_DSN }}" \
            --env SUPABASE_URL="${{ secrets.PROD_SUPABASE_URL }}" \
            --env SUPABASE_PUBLISHABLE_KEY="${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}" \
            --env STRIPE_SECRET_KEY="${{ secrets.PROD_STRIPE_SECRET_KEY }}" \
            --env STRIPE_PRICE_ID="${{ secrets.PROD_STRIPE_PRICE_ID }}" \
            --env LANGFUSE_PUBLIC_KEY="${{ secrets.PROD_LANGFUSE_PUBLIC_KEY }}" \
            --env LANGFUSE_SECRET_KEY="${{ secrets.PROD_LANGFUSE_SECRET_KEY }}" \
            --env LANGFUSE_BASE_URL="${{ secrets.PROD_LANGFUSE_BASE_URL }}")
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROD_VERCEL_PROJECT_ID }}

      - name: Create Deployment Summary
        run: |
          echo "### 🚀 Vercel Prod Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment URL:** [${{ env.DEPLOY_URL }}](${{ env.DEPLOY_URL }})" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.event.inputs.description }}" ]; then
            echo "- **Description/Notes:** ${{ github.event.inputs.description }}" >> $GITHUB_STEP_SUMMARY
          fi
